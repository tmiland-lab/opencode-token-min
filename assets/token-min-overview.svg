<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1119"/>
      <stop offset="1" stop-color="#0a0b10"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1e2d"/>
      <stop offset="1" stop-color="#141724"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="760" fill="url(#bg)"/>

  <!-- Title -->
  <text x="40" y="52" fill="#fff" font-size="34" font-weight="700">open</text>
  <text x="162" y="52" fill="#7aa2f7" font-size="34" font-weight="700">token-min</text>
  <text x="40" y="80" fill="#8b90a5" font-size="16">cache-aware context trimming plugin for opencode · the &quot;Context&quot; box, but honest</text>
  <rect x="40" y="94" width="1120" height="2" rx="1" fill="#2a2e3f"/>

  <!-- LEFT: pipeline -->
  <rect x="40" y="120" width="520" height="330" rx="12" fill="url(#box)" stroke="#2a2e3f"/>
  <text x="62" y="152" fill="#7aa2f7" font-size="16" font-weight="700">what it does</text>

  <!-- BEFORE -->
  <rect x="60" y="164" width="496" height="60" rx="8" fill="none" stroke="#4a4f66" stroke-dasharray="4 3"/>
  <text x="74" y="186" fill="#e8eaf2" font-size="13" font-weight="700">BEFORE · every step re-sends + re-bills all of history</text>
  <text x="74" y="206" fill="#8b90a5" font-size="12">100k+ chars · sys + every message + tool dumps</text>

  <!-- arrow down -->
  <polygon points="296,232 308,242 296,252" fill="#5d6478"/>

  <!-- transform plugin -->
  <rect x="60" y="242" width="496" height="108" rx="8" fill="#1c2333" stroke="#7aa2f7"/>
  <text x="74" y="264" fill="#7aa2f7" font-size="13" font-weight="700">transform · one hook before every model call</text>

  <rect x="70" y="272" width="158" height="68" rx="6" fill="#12151f" stroke="#3a3f5a"/>
  <text x="84" y="292" fill="#e8eaf2" font-size="12" font-weight="700">trim</text>
  <text x="84" y="310" fill="#8b90a5" font-size="11">per-role budgets</text>
  <text x="84" y="326" fill="#8b90a5" font-size="11">history + tail caps</text>

  <rect x="236" y="272" width="158" height="68" rx="6" fill="#12151f" stroke="#3a3f5a"/>
  <text x="250" y="292" fill="#e8eaf2" font-size="12" font-weight="700">digest</text>
  <text x="250" y="310" fill="#8b90a5" font-size="11">oversized tool dumps</text>
  <text x="250" y="326" fill="#8b90a5" font-size="11">keep tail useful</text>

  <rect x="402" y="272" width="144" height="68" rx="6" fill="#12151f" stroke="#3a3f5a"/>
  <text x="416" y="292" fill="#e8eaf2" font-size="12" font-weight="700">cached</text>
  <text x="416" y="310" fill="#8b90a5" font-size="11">cache-aware caps</text>
  <text x="416" y="326" fill="#8b90a5" font-size="11">never break warm</text>

  <text x="74" y="340" fill="#9ece6a" font-size="11">~saved tracked per step →</text>

  <!-- arrow down -->
  <polygon points="296,358 308,368 296,378" fill="#5d6478"/>

  <!-- AFTER -->
  <rect x="60" y="368" width="496" height="64" rx="8" fill="none" stroke="#9ece6a"/>
  <text x="74" y="390" fill="#9ece6a" font-size="14" font-weight="700">AFTER · digest-only context</text>
  <text x="74" y="410" fill="#9ece6a" font-size="13" font-weight="700">80–99% fewer tokens per task — the guide goal</text>
  <text x="74" y="424" fill="#8b90a5" font-size="11">tool outputs → short digests · cache respected</text>

  <!-- RIGHT: sidebar -->
  <rect x="600" y="120" width="560" height="330" rx="12" fill="url(#box)" stroke="#2a2e3f"/>
  <text x="622" y="152" fill="#7aa2f7" font-size="16" font-weight="700">what you see</text>

  <!-- sidebar box -->
  <rect x="620" y="164" width="376" height="248" rx="10" fill="#12151f" stroke="#7aa2f7"/>
  <text x="640" y="190" fill="#ffffff" font-size="14" font-weight="700">Context</text>
  <line x1="620" y1="202" x2="996" y2="202" stroke="#232738"/>

  <text x="640" y="230" fill="#e8eaf2" font-size="14">8,460 tokens</text>
  <text x="640" y="256" fill="#9ece6a" font-size="13">7% used</text>
  <text x="640" y="282" fill="#e5c07b" font-size="13">$1.23 spent</text>
  <text x="640" y="308" fill="#7aa2f7" font-size="13">~18,240 tokens saved</text>
  <text x="640" y="334" fill="#9ece6a" font-size="13">88% saved</text>
  <text x="640" y="360" fill="#f7768e" font-size="13">~5,030 tokens saved · last task</text>
  <text x="640" y="384" fill="#8b90a5" font-size="11">session vs the last task you ran</text>
  <text x="640" y="400" fill="#8b90a5" font-size="11">(the two numbers you actually wanted)</text>

  <!-- right annotation -->
  <line x1="1002" y1="230" x2="1024" y2="230" stroke="#5d6478"/>
  <text x="1030" y="226" fill="#8b90a5" font-size="12">real usage, live</text>
  <text x="1030" y="244" fill="#8b90a5" font-size="12">right-sidebar box</text>

  <!-- footer chips -->
  <rect x="620" y="422" width="250" height="26" rx="6" fill="#12151f" stroke="#3a3f5a"/>
  <text x="632" y="439" fill="#8b90a5" font-size="11">ledger · token-usage.jsonl (per-task)</text>

  <rect x="880" y="422" width="260" height="26" rx="6" fill="#12151f" stroke="#3a3f5a"/>
  <text x="892" y="439" fill="#8b90a5" font-size="11">tool:cost · session / today / all-time</text>

  <!-- BOTTOM: goal strip -->
  <rect x="40" y="470" width="1120" height="240" rx="12" fill="url(#box)" stroke="#2a2e3f"/>
  <text x="62" y="502" fill="#7aa2f7" font-size="16" font-weight="700">goal · the awesome LLM token-optimization guide</text>
  <text x="62" y="530" fill="#e8eaf2" font-size="14">re-cut what you re-send until &quot;costs stay flat&quot; is a habit, not a shock</text>

  <!-- 3 stat chips -->
  <rect x="62" y="552" width="340" height="110" rx="10" fill="#12151f" stroke="#4a4f66"/>
  <text x="82" y="580" fill="#9ece6a" font-size="26" font-weight="700">80–99%</text>
  <text x="82" y="604" fill="#9aa0b5" font-size="13">tokens trimmed per task</text>
  <text x="82" y="626" fill="#8b90a5" font-size="12">target from the guide</text>

  <rect x="420" y="552" width="340" height="110" rx="10" fill="#12151f" stroke="#4a4f66"/>
  <text x="440" y="580" fill="#f7768e" font-size="26" font-weight="700">~$0</text>
  <text x="440" y="604" fill="#9aa0b5" font-size="13">stays for re-sent history</text>
  <text x="440" y="626" fill="#8b90a5" font-size="12">0 until it trims</text>

  <rect x="778" y="552" width="362" height="110" rx="10" fill="#12151f" stroke="#4a4f66"/>
  <text x="798" y="580" fill="#7aa2f7" font-size="26" font-weight="700">one plugin</text>
  <text x="798" y="604" fill="#9aa0b5" font-size="13">server hook + sidebar box</text>
  <text x="798" y="626" fill="#8b90a5" font-size="12">drop-in via plugins/ + tui/</text>

  <text x="62" y="700" fill="#5d6478" font-size="12">≈ measured right now, in the box you are reading this in · figures per the token-min ledger</text>
  <text x="62" y="720" fill="#5d6478" font-size="12">opencode-token-min · MIT · make long sessions cheap again</text>
</svg>